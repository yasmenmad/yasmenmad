<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 16px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #fe7277; letter-spacing: 0.2px; }
    .stat-label { font: 500 11px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #a9b1d6; }
    .stat-value { font: 700 28px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #ffffff; }
    .stat-sub { font: 400 10px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #565f89; }
    .card-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 8px; }
    .ring-bg { stroke: #21262d; stroke-width: 5; fill: none; }
    .ring-val { stroke: #fe7277; stroke-width: 5; fill: none; stroke-linecap: round; }
  </style>

  <rect width="495" height="195" class="card-bg" />

  <text x="25" y="32" class="header">Contributions Summary</text>

  <!-- Left: Total Contributions -->
  <g transform="translate(45, 60)">
    <text x="45" y="42" text-anchor="middle" class="stat-value">520+</text>
    <text x="45" y="65" text-anchor="middle" class="stat-label">Total Contributions</text>
    <text x="45" y="85" text-anchor="middle" class="stat-sub">2024 - Present</text>
  </g>

  <!-- Center: Circular Gauge for Current Streak -->
  <g transform="translate(247, 98)">
    <circle cx="0" cy="0" r="38" class="ring-bg" />
    <!-- 270 degree arc -->
    <path d="M 0 -38 A 38 38 0 1 1 -36.5 10.5" class="ring-val" />
    <text x="0" y="8" text-anchor="middle" class="stat-value" fill="#fe7277">Daily</text>
    <text x="0" y="56" text-anchor="middle" class="stat-label" fill="#fe7277">Current Delivery</text>
    <text x="0" y="72" text-anchor="middle" class="stat-sub">Active Production</text>
  </g>

  <!-- Right: Verified Production Deployments -->
  <g transform="translate(360, 60)">
    <text x="45" y="42" text-anchor="middle" class="stat-value">7</text>
    <text x="45" y="65" text-anchor="middle" class="stat-label">Live Deployments</text>
    <text x="45" y="85" text-anchor="middle" class="stat-sub">100% Verified Uptime</text>
  </g>
</svg>
