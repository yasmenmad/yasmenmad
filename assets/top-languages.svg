<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 18px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #7aa2f7; }
    .lang-name { font: 500 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #c0caf5; }
    .lang-pct { font: 400 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #7aa2f7; }
    .card-bg { fill: #1a1b26; stroke: #24283b; stroke-width: 1.5; rx: 10px; }
    .divider { stroke: #24283b; stroke-width: 1; }
  </style>

  <rect width="495" height="195" class="card-bg" />

  <text x="25" y="38" class="header">Most Used Programming Languages</text>
  <line x1="25" y1="52" x2="470" y2="52" class="divider" />

  <!-- Multi-segment progress bar (Total width: 445px) -->
  <g transform="translate(25, 72)">
    <rect x="0" y="0" width="445" height="12" rx="6" fill="#24283b" />
    <!-- TypeScript: 45% = 200px -->
    <rect x="0" y="0" width="200" height="12" rx="6" fill="#3178c6" />
    <!-- Python: 35% = 156px -->
    <rect x="200" y="0" width="156" height="12" fill="#3572A5" />
    <!-- JavaScript: 20% = 89px -->
    <rect x="356" y="0" width="89" height="12" rx="6" fill="#f1e05a" />
  </g>

  <!-- Legend row 1 -->
  <g transform="translate(25, 115)">
    <!-- TypeScript -->
    <circle cx="6" cy="6" r="6" fill="#3178c6" />
    <text x="20" y="10" class="lang-name">TypeScript</text>
    <text x="140" y="10" class="lang-pct">45.0%</text>

    <!-- Python -->
    <circle cx="240" cy="6" r="6" fill="#3572A5" />
    <text x="254" y="10" class="lang-name">Python</text>
    <text x="375" y="10" class="lang-pct">35.0%</text>
  </g>

  <!-- Legend row 2 -->
  <g transform="translate(25, 150)">
    <!-- JavaScript -->
    <circle cx="6" cy="6" r="6" fill="#f1e05a" />
    <text x="20" y="10" class="lang-name">JavaScript (ES6+)</text>
    <text x="140" y="10" class="lang-pct">20.0%</text>

    <text x="240" y="10" class="lang-name" fill="#565f89">Architecture: Modular Source Files</text>
  </g>
</svg>