<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 16px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #58a6ff; }
    .lang-name { font: 500 12px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .lang-pct { font: 400 12px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #8b949e; }
    .card-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 8px; }
  </style>

  <rect width="495" height="195" class="card-bg" />

  <text x="25" y="32" class="header">Top Engineering Languages &amp; Frameworks</text>

  <!-- Progress Bar (Total 445px) -->
  <g transform="translate(25, 52)">
    <rect x="0" y="0" width="445" height="10" rx="5" fill="#21262d" />
    <!-- Python: 42.5% = 189px -->
    <rect x="0" y="0" width="189" height="10" rx="5" fill="#3572A5" />
    <!-- TypeScript: 33.0% = 147px -->
    <rect x="189" y="0" width="147" height="10" fill="#3178c6" />
    <!-- Apache Spark / SQL: 14.5% = 65px -->
    <rect x="336" y="0" width="65" height="10" fill="#E25A1C" />
    <!-- JavaScript: 10.0% = 44px -->
    <rect x="401" y="0" width="44" height="10" rx="5" fill="#f1e05a" />
  </g>

  <!-- Legend Grid -->
  <g transform="translate(25, 88)">
    <!-- Python -->
    <circle cx="6" cy="6" r="5" fill="#3572A5" />
    <text x="18" y="10" class="lang-name">Python (PyTorch, GeoPandas)</text>
    <text x="180" y="10" class="lang-pct">42.5%</text>

    <!-- TypeScript -->
    <circle cx="255" cy="6" r="5" fill="#3178c6" />
    <text x="267" y="10" class="lang-name">TypeScript (React 19, Three.js)</text>
    <text x="440" y="10" class="lang-pct">33.0%</text>
  </g>

  <g transform="translate(25, 122)">
    <!-- Apache Spark / SQL -->
    <circle cx="6" cy="6" r="5" fill="#E25A1C" />
    <text x="18" y="10" class="lang-name">Apache Spark &amp; SQL</text>
    <text x="180" y="10" class="lang-pct">14.5%</text>

    <!-- JavaScript -->
    <circle cx="255" cy="6" r="5" fill="#f1e05a" />
    <text x="267" y="10" class="lang-name">JavaScript (Node, WebGL)</text>
    <text x="440" y="10" class="lang-pct">10.0%</text>
  </g>
</svg>
