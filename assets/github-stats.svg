<svg width="495" height="195" viewBox="0 0 495 195" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .header { font: 600 16px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #fe7277; }
    .stat-label { font: 400 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #c9d1d9; }
    .stat-val { font: 700 13px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #ffffff; }
    .card-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 8px; }
    .icon { fill: #58a6ff; }
    .grade-circle { stroke: #fe7277; stroke-width: 4; fill: none; }
    .grade-text { font: 700 24px 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; fill: #fe7277; }
  </style>

  <rect width="495" height="195" class="card-bg" />

  <text x="25" y="32" class="header">Yasmine's GitHub Stats</text>

  <!-- Left Stats List -->
  <g transform="translate(25, 48)">
    <!-- Repositories -->
    <g transform="translate(0, 15)">
      <path class="icon" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5v-9zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8V1.5z"/>
      <text x="24" y="11" class="stat-label">Public Repositories:</text>
      <text x="180" y="11" class="stat-val">11 Repositories</text>
    </g>

    <!-- Total Commits -->
    <g transform="translate(0, 42)">
      <path class="icon" d="M10.5 7.75a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0zm1.43.75a4.002 4.002 0 0 1-7.86 0H.75a.75.75 0 1 1 0-1.5h3.32a4.002 4.002 0 0 1 7.86 0h3.32a.75.75 0 1 1 0 1.5h-3.32z"/>
      <text x="24" y="11" class="stat-label">Verified Commits:</text>
      <text x="180" y="11" class="stat-val">500+ Commits</text>
    </g>

    <!-- Live Deployments -->
    <g transform="translate(0, 69)">
      <path class="icon" d="M0 1.75C0 .784.784 0 1.75 0h12.5C15.216 0 16 .784 16 1.75v12.5A1.75 1.75 0 0 1 14.25 16H1.75A1.75 1.75 0 0 1 0 14.25V1.75zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V1.75a.25.25 0 0 0-.25-.25H1.75zM7.25 8a.75.75 0 0 1 .75-.75h4.25a.75.75 0 0 1 0 1.5H8a.75.75 0 0 1-.75-.75z"/>
      <text x="24" y="11" class="stat-label">Production Deployments:</text>
      <text x="180" y="11" class="stat-val">7 Web Apps (100% Uptime)</text>
    </g>

    <!-- Technical Focus -->
    <g transform="translate(0, 96)">
      <path class="icon" d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0zM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0z"/>
      <text x="24" y="11" class="stat-label">Engineering Focus:</text>
      <text x="180" y="11" class="stat-val">Distributed Systems &amp; AI</text>
    </g>
  </g>

  <!-- Right: Grade Circle A+ -->
  <g transform="translate(420, 105)">
    <circle cx="0" cy="0" r="32" class="grade-circle" />
    <text x="0" y="9" text-anchor="middle" class="grade-text">A+</text>
  </g>
</svg>
